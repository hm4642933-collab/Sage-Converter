<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sage 50 Remittance Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: #ffffff; width: 100%; max-width: 480px; padding: 30px; border-radius: 12px; text-align: center; }
        h2 { color: #0f172a; margin-bottom: 10px; }
        input[type="file"] { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #cbd5e1; border-radius: 6px; }
        .btn { background: #2563eb; color: #fff; border: none; width: 100%; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        #status { margin-top: 15px; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sage 50 Import Converter</h2>
    <input type="file" id="excelFile" accept=".xlsx, .xls">
    <button class="btn" onclick="processExcel()">Convert & Download CSV</button>
    <div id="status"></div>
</div>

<script>
function processExcel() {
    const fileInput = document.getElementById('excelFile');
    const status = document.getElementById('status');
    
    if (!fileInput.files.length) {
        alert("Pehle Excel file select karein!");
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(worksheet);

            let rows = [["Type", "Account Ref", "Nominal Code", "Dept Code", "Date", "Ref", "Details", "Net Amount", "Tax Code", "Tax Amount"]];

            jsonData.forEach(row => {
                let acc = row['Sage Code'] || row['SU ID'] || '';
                let dt = row['Bank Date'] || '';
                let ref = row['Reference'] || '';
                let period = row['Ex Period'] || '';
                let amt = parseFloat(row['Amount']) || 0;

                rows.push(["SR", acc, "1200", "0", dt, ref, `Period:${period}`, amt.toFixed(2), "T9", "0.00"]);
            });

            let csvString = rows.map(r => r.join(",")).join("\r\n");
            let blob = new Blob([csvString], { type: 'text/csv' });
            let a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'Sage_Import.csv';
            a.click();

            status.style.color = "green";
            status.innerText = "✓ CSV Ready! Sage 50 mein import karein.";
        } catch(err) {
            status.style.color = "red";
            status.innerText = "Error: " + err.message;
        }
    };
    reader.readAsArrayBuffer(fileInput.files[0]);
}
</script>

</body>
</html>
