<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sage 50 Remittance Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: #ffffff; width: 100%; max-width: 500px; padding: 35px; border-radius: 16px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { color: #0f172a; margin-bottom: 8px; font-size: 22px; }
        p { color: #64748b; font-size: 14px; margin-bottom: 25px; }
        
        .file-input-wrapper { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: 600; color: #334155; margin-bottom: 8px; font-size: 14px; }
        input[type="file"] { width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 8px; background: #f8fafc; font-size: 14px; cursor: pointer; }
        
        .btn { background: #2563eb; color: #ffffff; border: none; width: 100%; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #1d4ed8; }
        
        #status { margin-top: 20px; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; display: none; }
        .success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; display: block !important; }
        .error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; display: block !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sage 50 Remittance Converter</h2>
    <p>Select your Remittance Excel file to download Sage 50 CSV</p>
    
    <div class="file-input-wrapper">
        <label for="excelFile">Choose Remittance Excel File:</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls">
    </div>

    <button class="btn" onclick="processExcel()">Convert & Download CSV</button>
    
    <div id="status"></div>
</div>

<script>
function processExcel() {
    const fileInput = document.getElementById('excelFile');
    const status = document.getElementById('status');
    
    status.className = "";
    status.style.display = "none";

    if (!fileInput.files.length) {
        status.className = "error";
        status.innerText = "Pehle 'Choose File' par click karke Excel File select karein!";
        return;
    }

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet);

            if (!jsonData || jsonData.length === 0) {
                status.className = "error";
                status.innerText = "Excel file khaali hai ya format sahi nahi hai.";
                return;
            }

            let csvRows = [];
            // Exact 10 Column Headers to match Sage 50 Transaction v2021.map
            csvRows.push([
                "Type", 
                "Account Reference", 
                "Nominal A/C Ref", 
                "Department Code",
                "Date", 
                "Reference", 
                "Details", 
                "Net Amount", 
                "Tax Code", 
                "Tax Amount"
            ]);

            jsonData.forEach(row => {
                let accountRef = row['Sage Code'] || row['SU ID'] || row['SUID'] || '';
                let bankDate = row['Bank Date'] || row['Bank date'] || '';
                let ref = row['Reference'] || '';
                let period = row['Ex Period'] || row['Invoice Period'] || '';
                let invNo = row['invoice number'] || row['Invoice Number'] || '';
                
                let details = invNo ? `Inv:${invNo} P:${period}` : `Remittance P:${period}`;

                let invAmt = parseFloat(row['Invoice Amount']) || 0;
                let recAmt = parseFloat(row['Amount']) || 0;

                let bankCode = '1200';
                let deptCode = '0';
                let taxCode = 'T9';
                let taxAmt = '0.00';

                if (invAmt > 0 && recAmt > invAmt) {
                    csvRows.push(["SR", accountRef, bankCode, deptCode, bankDate, ref, details, invAmt.toFixed(2), taxCode, taxAmt]);
                    let poaAmt = recAmt - invAmt;
                    csvRows.push(["SA", accountRef, bankCode, deptCode, bankDate, ref, `${details} - POA`, poaAmt.toFixed(2), taxCode, taxAmt]);
                } else {
                    csvRows.push(["SR", accountRef, bankCode, deptCode, bankDate, ref, details, recAmt.toFixed(2), taxCode, taxAmt]);
                }
            });

            let csvContent = "data:text/csv;charset=utf-8," + csvRows.map(e => e.join(",")).join("\n");
            let encodedUri = encodeURI(csvContent);
            
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Sage50_Income_Import.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            status.className = "success";
            status.innerText = "✓ Success! Perfect Sage 50 CSV Downloaded.";
        } catch (err) {
            status.className = "error";
            status.innerText = "Error: " + err.message;
        }
    };

    reader.readAsArrayBuffer(file);
}
</script>

</body>
</html>
